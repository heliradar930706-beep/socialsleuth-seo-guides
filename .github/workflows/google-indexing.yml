name: Google Indexing API URL_UPDATED

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Optional HTTPS page URLs, separated by commas"
        required: false
        type: string
  schedule:
    - cron: "21 * * * *"
  push:
    paths:
      - "**/*.md"
      - "**/*.html"
      - "**/*.xml"
      - "public/**"

permissions:
  contents: read

concurrency:
  group: google-indexing-api
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements-indexing.txt
      - name: Restore submission history
        uses: actions/cache/restore@v4
        with:
          path: .indexing-state.json
          key: indexing-history-${{ github.run_id }}
          restore-keys: |
            indexing-history-
      - name: Notify Google
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          INDEXING_SITEMAPS: ${{ vars.INDEXING_SITEMAPS }}
          INDEXING_URLS: ${{ inputs.urls }}
        run: python scripts/indexing_submit.py
      - name: Save submission history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .indexing-state.json
          key: indexing-history-${{ github.run_id }}
